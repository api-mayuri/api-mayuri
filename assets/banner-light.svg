<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-label="api mayuri">
  <defs>
    <clipPath id="card"><rect width="900" height="200" rx="16"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f0ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <style>
      .name { font: 600 56px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2328; letter-spacing: 2px; }
      .sub  { font: 400 18px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #59636e; letter-spacing: 1px; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>
  <rect width="900" height="200" rx="16" fill="url(#bg)"/>
  <g clip-path="url(#card)">
    <circle cx="780" cy="40" r="120" fill="#7c3aed" opacity="0.08"/>
    <circle cx="860" cy="170" r="80" fill="#2563eb" opacity="0.08"/>
  </g>
  <text x="56" y="108" class="name">api mayuri</text>
  <rect x="425" y="64" width="26" height="52" rx="3" fill="url(#accent)" class="cursor"/>
  <rect x="56" y="132" width="64" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="56" y="166" class="sub">software developer · open source</text>
</svg>
